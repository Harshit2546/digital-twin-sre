services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shopfront
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "${TWIN_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d shopfront"]
      interval: 2s
      timeout: 2s
      retries: 10

  payments-stub:
    build: ./payments
    ports:
      - "${TWIN_PAYMENTS_PORT:-8001}:8001"
    environment:
      - MODE=ok

  api:
    build: ./api
    ports:
      - "${TWIN_API_PORT:-8000}:8000"
    environment:
      - DB_URL=postgresql://user:password@db:5432/shopfront
      - PAYMENTS_URL=http://payments-stub:8001
      - APP_CONFIG=/app/config/app.yaml
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      payments-stub:
        condition: service_started

  worker:
    build: ./worker
    environment:
      - DB_URL=postgresql://user:password@db:5432/shopfront
      - APP_CONFIG=/app/config/app.yaml
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
